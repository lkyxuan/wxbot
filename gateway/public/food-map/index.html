<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>美食地图</title>
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
  :root { --bg: #fff; --fg: #1f2328; --muted: #6b7280; --line: #e5e7eb; --accent: #e8590c; --card: #f8fafc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --fg: #e6e8eb; --muted: #9aa3ad; --line: #2a2f36; --accent: #ff8a3d; --card: #1a1e24; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  header h1 { font-size: 17px; margin: 0; white-space: nowrap; }
  header .count { color: var(--muted); font-size: 13px; white-space: nowrap; }
  #q { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--fg); font-size: 15px; }
  #map { flex: 1 1 55%; min-height: 240px; }
  #list { flex: 1 1 45%; overflow-y: auto; border-top: 1px solid var(--line); }
  .item { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:active, .item.on { background: var(--card); }
  .name { font-weight: 600; }
  .meta, .note { color: var(--muted); font-size: 13px; }
  .note { color: var(--fg); }
  .empty { padding: 24px 16px; color: var(--muted); text-align: center; }
  .pop .name { font-size: 15px; }
  .pop a { color: var(--accent); }
  @media (min-width: 900px) {
    body { flex-direction: row; flex-wrap: wrap; }
    header { flex-basis: 100%; }
    #list { flex: 0 0 380px; height: calc(100% - 53px); border-top: 0; border-right: 1px solid var(--line); order: -1; }
    #map { height: calc(100% - 53px); }
  }
</style>
</head>
<body>
<header>
  <h1>美食地图</h1>
  <input id="q" type="search" placeholder="搜店名、菜系、区域、推荐人">
  <span class="count" id="count"></span>
</header>
<div id="map"></div>
<div id="list"></div>
<script src="leaflet/leaflet.js"></script>
<script>
// 数据由美食地图 MCP 写到 data.json；坐标是高德（GCJ-02），配高德底图不会偏移
const map = L.map('map', { zoomControl: true, attributionControl: true });
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  subdomains: '1234', maxZoom: 18, attribution: '© 高德地图'
}).addTo(map);
map.setView([31.23, 121.47], 11);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const amapLink = p => `https://uri.amap.com/marker?position=${p.lng},${p.lat}&name=${encodeURIComponent(p.name)}&src=wxbot&coordinate=gaode&callnative=1`;
const meta = p => [p.district, (p.category || '').split(';').pop(), p.rating && `评分${p.rating}`, p.cost && `人均${Math.round(p.cost)}元`]
  .filter(Boolean).join(' · ');

let places = [], markers = new Map();

function render(filter) {
  const kw = (filter || '').trim().toLowerCase();
  const shown = places.filter(p => !kw || [p.name, p.category, p.district, p.address, p.note, p.added_by, p.city]
    .some(v => String(v || '').toLowerCase().includes(kw)));
  markers.forEach(m => m.remove());
  markers.clear();
  const list = document.getElementById('list');
  list.innerHTML = shown.length ? '' : '<div class="empty">还没有符合条件的店</div>';
  shown.forEach(p => {
    if (p.lat != null && p.lng != null) {
      const m = L.circleMarker([p.lat, p.lng], { radius: 8, color: '#fff', weight: 2, fillColor: '#e8590c', fillOpacity: .95 })
        .bindPopup(`<div class="pop"><div class="name">${esc(p.name)}</div>
          <div>${esc(p.address || '')}</div><div>${esc(meta(p))}</div>
          ${p.note ? `<div>“${esc(p.note)}”${p.added_by ? ' —' + esc(p.added_by) : ''}</div>` : ''}
          <div><a href="${amapLink(p)}" target="_blank" rel="noopener">在高德中打开 / 导航</a></div></div>`)
        .addTo(map);
      markers.set(p.id, m);
    }
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<div class="name">#${p.id} ${esc(p.name)}</div><div class="meta">${esc(meta(p))}</div>
      ${p.note ? `<div class="note">“${esc(p.note)}”${p.added_by ? ' —' + esc(p.added_by) : ''}</div>` : ''}`;
    div.onclick = () => {
      const m = markers.get(p.id);
      if (m) { map.setView(m.getLatLng(), 16); m.openPopup(); }
      document.querySelectorAll('.item.on').forEach(e => e.classList.remove('on'));
      div.classList.add('on');
    };
    list.appendChild(div);
  });
  document.getElementById('count').textContent = `${shown.length} 家`;
  const pts = shown.filter(p => p.lat != null).map(p => [p.lat, p.lng]);
  if (pts.length === 1) map.setView(pts[0], 15);
  else if (pts.length > 1) map.fitBounds(pts, { padding: [30, 30], maxZoom: 15 });
}

document.getElementById('q').addEventListener('input', e => render(e.target.value));
fetch('data.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : { places: [] })
  .catch(() => ({ places: [] }))
  .then(d => { places = d.places || []; render(''); });
</script>
</body>
</html>
