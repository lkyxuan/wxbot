[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wxbot"
version = "0.1.0"
description = "基于 wxautox4 的 Windows 微信自动化机器人"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 付费闭源库，仅 Windows；需自行购买激活码
wx = ["wxautox4>=41.2.1; sys_platform == 'win32'"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
wxbot = "wxbot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
